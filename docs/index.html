<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080c">
  <title>DogeGB</title>
  <link rel="stylesheet" href="app.css?v=14">
</head>
<body>
  <video id="cam" autoplay muted playsinline webkit-playsinline></video>
  <div id="app">
    <header class="top">
      <button id="back" type="button" hidden>Back</button>
      <p id="dots" class="dots"></p>
    </header>
    <div id="screen"><p class="lead" id="boot">Loading…</p></div>
  </div>
  <script>
    window.addEventListener("error", function (ev) {
      var boot = document.getElementById("boot");
      if (!boot) return;
      boot.textContent = (ev && ev.message) || "This page did not start.";
    });
  </script>
  <script src="jsQR.js?v=9"></script>
  <script src="codec.js?v=9"></script>
  <script src="app.js?v=14"></script>
</body>
</html>
